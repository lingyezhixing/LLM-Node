services:
  llm-node:
    container_name: llm-node
    build: .
    image: lingyezhixing/llm-node:latest
    volumes:
      - .:/app
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - "8080:8080"
    environment:
      - LOG_LEVEL=DEBUG
    restart: always
    networks:
      - open-webui-net
      - nastool-net

networks:
  open-webui-net:
    external: true
  nastool-net:
    external: true