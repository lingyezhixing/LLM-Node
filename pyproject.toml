[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-node"
version = "2.0.0"
requires-python = ">=3.11"
# 依赖全部 == 精确锁定(与 LLM-Manager 对齐;升级需显式改版本 + 全量验证)。
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "httpx==0.28.1",
  "psutil==7.2.2",
  "PyYAML==6.0.3",
  "pydantic==2.13.4",
]

[project.optional-dependencies]
monitoring = ["pythonnet==3.1.0"]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.1", "pyright==1.1.411"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# 规则集跟随版本默认(riff 0.16.1 全套),版本在 dev 依赖中 == 固定。

[tool.pyright]
include = ["src/llm_node"]
